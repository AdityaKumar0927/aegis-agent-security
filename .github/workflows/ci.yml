name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check aegis harness tests
      - name: Mypy
        run: mypy aegis

  test:
    name: Test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify shipped model loads (integrity + format + dimension)
        run: python -c "from aegis.sanitizer.classifier import InjectionClassifier as C; c=C(); c.load_model(C._model_path()); print('model ok', c.n_features)"
      - name: Verify the shipped model is used, not silently retrained
        run: python -c "from aegis.sanitizer import SanitizationPipeline as P; s=P.default().model_source; print('model source:', s); assert s.startswith('loaded:'), 'fell back to retraining: '+s"
      - name: Test
        run: pytest -q --cov=aegis --cov-report=term-missing

  package:
    name: Build & check wheel ships the model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Assert model + py.typed are in the wheel
        run: |
          python - <<'PY'
          import glob, zipfile
          w = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(w).namelist()
          assert "aegis/py.typed" in names, "py.typed missing from wheel"
          assert "aegis/data/injection_model.npz" in names, "model missing from wheel"
          assert "aegis/data/injection_model.npz.sha256" in names, "manifest missing"
          print("wheel OK:", w)
          PY
